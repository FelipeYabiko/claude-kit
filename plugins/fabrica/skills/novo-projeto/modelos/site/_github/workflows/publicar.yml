# Publica a pasta site/ no GitHub Pages a cada envio para a main.
# Antes de publicar, o fiscal roda no modo final: com erro, o site antigo continua no ar.
# Para ligar (uma vez só): no GitHub, Settings → Pages → Source: "GitHub Actions".
name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fiscal (modo final)
        run: node ferramentas/fiscal.mjs --final
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publicacao
        uses: actions/deploy-pages@v5
